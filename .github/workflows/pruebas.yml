# Revisión automática en cada cambio: sintaxis, base de datos (se instala dos veces seguidas) y prueba de humo de Tareas.
name: Pruebas

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}   # botón «Run workflow» para reinstalar la base de datos a mano

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: prueba }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis
        run: for f in tareas/*.js comun/*.js pendientes/*.js contenido/*.js sw.js config.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Versiones de las páginas y Contenido con más de 1.000 filas
        run: |
          node pruebas/versiones.js
          node pruebas/contenido-paginas.js
          node pruebas/sesion-unidad.js
      - name: Base de datos (dos veces seguidas)
        env: { PGPASSWORD: prueba }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "create database cil"
          cat pruebas/stub-supabase.sql supabase/cil.sql supabase/cil.sql | psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q
      - name: Seguridad (lo que un empleado no puede hacer)
        env: { PGPASSWORD: prueba }
        run: pruebas/seguridad.sh "psql -h localhost -U postgres -d cil"
      - name: Pruebas del robot de Yobel
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/robot.sql
      - name: Medidas del precio (el bot dice «el gramo»)
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/medidas.sql
      - name: Costos (solo gerencia y acceso «costos»)
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/costos.sql
      - name: Llegada desde el primer intento en la red del local
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/llegada-intentos.sql
      - name: La red nueva se registra sola solo con las dos condiciones
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/red-sola.sql
      - name: Avisos con emoji de la herramienta, 🔴 y agrupados
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/avisos-emoji.sql
      - name: Contenido, quién puede ver y tocar sus tablas
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/contenido-permisos.sql
      - name: Robot de Yobel, descuento de las cuentas de cobro
        env: { PGPASSWORD: prueba }
        run: psql -h localhost -U postgres -d cil -v ON_ERROR_STOP=1 -q -f pruebas/robot-descuento.sql
      - name: Pruebas del bot (Claude y ManyChat simulados, base de datos real)
        env: { PGPASSWORD: prueba }
        run: pruebas/bot/correr.sh
      - name: Prueba de humo
        run: |
          # Usa el Chrome que ya trae la máquina de GitHub (bajar el navegador se quedaba pegado).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright@1.56.1 >/dev/null
          export CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROMIUM" ]; then npx playwright install --with-deps chromium >/dev/null; fi
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node pruebas/humo.js
          node pruebas/recorrido.js
          node pruebas/red-movil.js
          node pruebas/locales-wifi.js
          node pruebas/contenido.js
          node pruebas/contenido-checklist.js
          node pruebas/contenido-historias.js
          node pruebas/contenido-copy.js
          node pruebas/contenido-inicio.js
          node pruebas/contenido-devolver.js
          node pruebas/contenido-revisar.js
          node pruebas/sesiones.js
          node pruebas/armador.js
          node pruebas/armador-stock.js
          node pruebas/armador-medidas.js
          node pruebas/armador-costo.js
          node pruebas/armador-unir.js
          node pruebas/armador-cola.js
          node pruebas/armador-yobel.js
          node pruebas/armador-descripcion.js
          node pruebas/cambiar.js
          node pruebas/consumibles-gerencia.js
          PGPASSWORD=prueba PSQL="psql -h localhost -U postgres -d cil" node pruebas/pendientes.js

  # Si las pruebas pasan y es la rama principal, instala cil.sql en Supabase (no borra datos).
  # Necesita el secreto SUPABASE_DB_URL (Session pooler). Sin el secreto, este paso no hace nada.
  aplicar:
    needs: pruebas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cil.sql en Supabase
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then echo "Sin SUPABASE_DB_URL: no se instala nada."; exit 0; fi
          set -o pipefail
          docker run --rm -e DB -v "$PWD/supabase:/sql:ro" postgres:17 sh -c 'psql "$DB" -v ON_ERROR_STOP=1 -q -f /sql/cil.sql' 2>&1 | { grep -v NOTICE || true; }
          echo "cil.sql instalado"
      - name: Revisar lo instalado (sin datos de personas)
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then exit 0; fi
          docker run --rm -e DB postgres:17 psql "$DB" -At -v ON_ERROR_STOP=1 -c "
            select 'Locales con el mismo Wi-Fi: ' || coalesce(string_agg(nombre || ' (' || sitio || ')', ', ' order by nombre), 'ninguno') from public.locales where coalesce(sitio, '') <> '';
            select 'Locales aparte: ' || coalesce(string_agg(nombre, ', ' order by nombre), 'ninguno') from public.locales where coalesce(sitio, '') = '';
            select 'Feriados de diciembre 2026 para todos los locales: ' || coalesce(string_agg(to_char(fecha, 'DD') || ' ' || nombre, ', ' order by fecha), 'ninguno') from public.dias_especiales where fecha in ('2026-12-24', '2026-12-25', '2026-12-31') and local_id is null and tipo = 'libre';
            select 'Bot: ' || string_agg(clave || '=' || valor, ', ' order by clave) from public.bot_config where clave in ('activo','modo','proveedor','verificar_robot','descuento_yobel','descuento_aprobar');
            select 'Bot, últimos 7 días: ' || count(*) filter (where rol = 'user') || ' mensajes de clientes, ' || count(*) filter (where rol = 'assistant' and not traspaso) || ' respuestas, ' || count(*) filter (where traspaso) || ' pasados a persona, ' || count(distinct contacto) || ' chats' from public.bot_mensajes where creado > now() - interval '7 days';
            select 'Avisos del bot/robot (7 días): ' || coalesce(string_agg(t || ' ' || n, ', ' order by n desc), 'ninguno') from (select split_part(tipo, ':', 1) t, count(*) n from public.bot_avisos where creado > now() - interval '7 days' group by 1) x;
            select 'Robot: última subida ' || coalesce(datos->'robot'->>'fecha', 'nunca') || ', productos ' || jsonb_array_length(datos->'productos') || ', con descripción ' || (select count(*) from jsonb_array_elements(datos->'productos') p where coalesce(p->>'descripcion','') <> '') || ', con ficha/notas ' || (select count(*) from jsonb_array_elements(datos->'productos') p where coalesce(p->>'ficha','') <> '' or coalesce(p->>'notas','') <> '') || ', nuevos por aprobar ' || coalesce(jsonb_array_length(datos->'nuevos'), 0) from public.armador_datos where id = 1;
            select 'Avisos enviados (7 días): ' || count(*) || ', urgentes ' || count(*) filter (where urgente) || ', sin leer ' || count(*) filter (where leido_en is null) from public.avisos_log where creado_en > now() - interval '7 days';
            select 'Avisos por tipo (7 días, sin nombres): ' || string_agg(k || (case when u then ' urg ' else ' ' end) || n, ', ' order by n desc) from (select replace(split_part(regexp_replace(url, '^(\.\.?/)+', ''), '/', 1), '#', '') || '#' || coalesce(substring(url from '#/?([a-z]+)'), '') || ':' || left(titulo, 2) k, urgente u, count(*) n from public.avisos_log where creado_en > now() - interval '7 days' group by 1, 2 order by 3 desc limit 25) x;
            select 'Avisos por día (7 días): ' || string_agg(to_char(d, 'DD') || '=' || n, ', ' order by d) from (select (creado_en at time zone 'America/Caracas')::date d, count(*) n from public.avisos_log where creado_en > now() - interval '7 days' group by 1) x;
            select 'Contenido por paso: ' || coalesce(string_agg(fase || ' ' || n, ', '), 'nada') from (select fase, count(*) n from public.piezas group by fase order by 2 desc) x;"
