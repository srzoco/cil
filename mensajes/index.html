<style id="css">
/* Layout: mostrador de dos paneles. Lista de productos a la izquierda, el mensaje como burbuja de chat a la derecha; en teléfono, un panel a la vez con barra inferior. */
:root{
  /* Colores de Barquero Food (los mismos de CIL): azul #001E54 y grises; el dorado se queda solo en el descuento (señal de venta) */
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --surface-2:#EDF0F5;
  --ink:#0E1A33;
  --muted:#4D5870;
  --line:#D9DFEA;
  --accent:#001E54;
  --accent-ink:#FFFFFF;
  --accent-soft:#E5EBF5;
  --gold-bg:#F4E3B5;
  --gold-ink:#5E4005;
  --gold-line:#DDBF72;
  --bubble:#E4EDF9;
  --danger:#A3263A;
  --danger-soft:#FBE9EC;
  --shadow:rgb(0 30 84 / .08);
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="claro"]){
    --bg:#0A1328; --surface:#111E3A; --surface-2:#1A2747; --ink:#F3F6FB; --muted:#BCC6DA; --line:#34487C;
    --accent:#A9C2F5; --accent-ink:#001E54; --accent-soft:#1A2A50;
    --gold-bg:#382C0E; --gold-ink:#F1D48C; --gold-line:#6A5420;
    --bubble:#18294A; --danger:#F29AA7; --danger-soft:#3A1D29; --shadow:rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="oscuro"]{
  --bg:#0A1328; --surface:#111E3A; --surface-2:#1A2747; --ink:#F3F6FB; --muted:#BCC6DA; --line:#34487C;
  --accent:#A9C2F5; --accent-ink:#001E54; --accent-soft:#1A2A50;
  --gold-bg:#382C0E; --gold-ink:#F1D48C; --gold-line:#6A5420;
  --bubble:#18294A; --danger:#F29AA7; --danger-soft:#3A1D29; --shadow:rgb(0 0 0 / .4);
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

/* Cabecera */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-block:20px 16px}
.eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;text-wrap:balance}
.disc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 16px;background:var(--gold-bg);color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:var(--radius);padding:10px 12px 10px 14px}
.disc-label{grid-column:1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.disc-meta{grid-column:1;margin:0;font-size:12.5px;opacity:.85}
.disc-ctl{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:6px}
.disc-ctl input{width:2.4em;text-align:right;font:400 30px/1 var(--display);color:var(--gold-ink);background:transparent;border:0;border-bottom:2px dashed var(--gold-line);padding:2px 0;font-variant-numeric:tabular-nums}
.disc-ctl input:disabled{border-bottom-color:transparent}
.pct{font:400 22px/1 var(--display)}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold-line);background:var(--surface);color:var(--gold-ink);font-size:18px;line-height:1;cursor:pointer}
.step:disabled{opacity:.4;cursor:not-allowed}

/* Pestañas */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;margin-block:0 16px}
.tabs button{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}

.note,.warn{margin:0 0 16px;background:var(--gold-bg);color:var(--gold-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.warn{margin:0}
.err{color:var(--danger);font-weight:600;margin:8px 0 0}

/* Campos */
.field{width:100%;box-sizing:border-box;font:15px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.field{resize:vertical}
.flabel{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.hint{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.lbl{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Botones */
.btn{font-weight:700;font-size:14px;border-radius:10px;padding:11px 16px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--danger);color:var(--bg)}
.btn.danger-ghost{background:transparent;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0;cursor:pointer;justify-self:start}

/* Armar */
.armar{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.picker{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-block:12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plist{display:grid;gap:8px}
.prod{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;color:inherit;font-size:15px}
.prod:hover{border-color:var(--accent)}
.prod[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tick{width:22px;height:22px;box-sizing:border-box;border-radius:6px;border:1.5px solid var(--muted);margin-top:1px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accent-ink)}
.prod[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.prod[aria-pressed="true"] .tick::after{content:"✓"}
.prod-main{min-width:0}
.prod-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prod-name{font-weight:700;min-width:0}
.prod-cat{font-size:12px;color:var(--muted);white-space:nowrap}
.prod-lines{display:grid;gap:2px;margin-top:4px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.price{color:var(--ink);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:28px 12px;margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);display:grid;gap:12px;justify-items:center}
.empty.small{padding:16px 12px;font-size:14px}

.composer{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;box-shadow:0 1px 3px var(--shadow)}
.comp-head{display:flex;align-items:baseline;gap:8px}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
.selected{display:grid;gap:8px}
.sitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.sitem-top{display:flex;gap:8px;align-items:flex-start}
.sname{font-weight:600;font-size:14px;flex:1;min-width:0}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vchip{font-size:12.5px;font-weight:500;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 8px;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.vchip[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.bubble{width:100%;box-sizing:border-box;background:var(--bubble);color:var(--ink);border:0;border-radius:16px 16px 4px 16px;padding:14px 16px;font:15px/1.5 var(--body);resize:none;min-height:150px;white-space:pre-wrap;overflow:hidden;font-variant-numeric:tabular-nums}
.bubble::placeholder{color:var(--muted)}
.bubble.static{min-height:0;margin:0;overflow-wrap:anywhere}
#copy{flex:1}

.msgbar{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px var(--shadow);font-weight:700}
.msgbar.show{display:flex}

@media (min-width:880px){
  .armar{grid-template-columns:minmax(0,1fr) minmax(0,400px);align-items:start}
  .composer{position:sticky;top:16px}
  .back.mobile{display:none}
  .msgbar.show{display:none}
}
@media (max-width:879px){
  .armar[data-mode="list"] .composer{display:none}
  .armar[data-mode="msg"] .picker{display:none}
  body.has-bar{padding-bottom:96px}
}

/* Catálogo */
.cat-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.sub{margin:4px 0 0;color:var(--muted);max-width:62ch;font-size:14px}
.clist{display:grid;gap:8px;margin-top:4px}
.cgroup{margin:16px 0 0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crow{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.crow-main{flex:1;min-width:0}
.cname{margin:0;font-weight:700}
.cmeta{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.cvars{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:13.5px;font-variant-numeric:tabular-nums}
.web{color:var(--muted)}
.hoy{font-weight:700}
.ajustes{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.ajustes summary{font-weight:700;cursor:pointer}
.aj-body{padding-bottom:4px}
.aj-body .btn{margin-top:14px}

.editor{display:grid;gap:12px}
.ed-grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.ed-form,.ed-prev{min-width:0}
.ed-prev{display:grid;gap:8px;align-content:start}
.row2{display:grid;gap:0 16px;grid-template-columns:minmax(0,1fr)}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 14px;margin:16px 0 0;display:grid;gap:10px;min-width:0}
legend{font-weight:700;font-size:13px;padding:0 6px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.vrow .v-texto{grid-column:1 / -1}
.v-price{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;color:var(--muted);font-weight:700}
.v-price input{border:0;background:transparent;width:100%;min-width:0;font:700 15px var(--body);padding:10px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.v-price input:focus{outline:none}
.v-price:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.v-kilo{display:flex;gap:6px;align-items:center;font-size:13.5px;white-space:nowrap;cursor:pointer}
.v-del{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.emojis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emojis button{font-size:18px;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;padding:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--danger-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:10px}
.confirm span{flex:1 1 200px}
.ed-form .actions{margin-top:16px}

@media (min-width:560px){
  .row2{grid-template-columns:1fr 1fr}
  .vrow{grid-template-columns:minmax(0,1fr) 120px auto auto}
  .vrow .v-texto{grid-column:auto}
}
@media (min-width:880px){
  .ed-grid{grid-template-columns:minmax(0,1fr) minmax(0,360px);align-items:start}
  .ed-prev{position:sticky;top:16px}
}

body:not(.owner) .owner-only{display:none!important}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* Descuento por confirmar */
.disc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.disc.pending{background:var(--surface);border-style:dashed}
.mini{border:1px solid var(--gold-line);background:var(--gold-bg);color:var(--gold-ink);font-weight:700;font-size:12.5px;border-radius:999px;padding:3px 10px;cursor:pointer}
.warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.warn span{flex:1 1 180px}
.stamp{margin:0 0 12px;font-size:13px;color:var(--muted)}
/* Herramientas de la dueña */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.report{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin:4px 0 16px;display:grid;gap:10px}
.report h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px}
.report ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px;font-variant-numeric:tabular-nums}
.report .tally{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink)}
.pill.up{background:var(--accent-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--surface-2);color:var(--ink);vertical-align:1px}
.tag.off{background:var(--danger-soft);color:var(--danger)}
.prod-lines .sin{opacity:.55}
.pill.alert{background:var(--danger-soft);color:var(--danger)}
.report details summary{cursor:pointer;font-weight:600;font-size:14px}
.report .scroll{max-height:260px;overflow:auto;margin-top:6px}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgb(0 0 0 / .25);z-index:10}
.busy p{background:var(--surface);color:var(--ink);padding:14px 18px;border-radius:12px;font-weight:700;margin:0;box-shadow:0 4px 20px var(--shadow)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:9px 8px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.head-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;cursor:pointer;min-width:0}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{flex:none;width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked + .track{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .track::after{transform:translateX(18px);background:var(--accent-ink)}
.sw input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.sw-text{display:grid;gap:1px;min-width:0}
.sw-text b{font-size:14px}
.sw-text small{font-size:12px;color:var(--muted)}
body.usd .sw{border-color:var(--accent);background:var(--accent-soft)}
body.usd .disc{opacity:.45}
#usd-badge{display:none;margin-left:4px}
body.usd #usd-badge{display:inline-block}
@media (max-width:559px){.head-ctl{width:100%}.head-ctl > *{flex:1 1 100%}}
@media (prefers-reduced-motion: reduce){.sw .track,.sw .track::after{transition:none}}
.disc-rates{grid-column:1;margin:0;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.disc-rates:empty{display:none}
.disc .auto-val{display:none}
.disc.auto .auto-val{display:flex;align-items:baseline;gap:4px}
.disc.auto .manual{display:none}
#disc-auto{font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.disc.auto .disc-ctl{grid-row:1 / span 3}
.disc-meta .sub-line{flex-basis:100%;font-size:12px;opacity:.85}
.disc-meta .alert-line{font-weight:700}
.disc.pending .alert-line{color:var(--danger)}
.disc-actions{grid-column:1 / -1;display:flex;gap:8px;margin-top:4px}
.mini:disabled{opacity:.5;cursor:wait}
.disc .disc-ctl input::placeholder{color:var(--gold-line)}
.disc-rates{white-space:pre-line}
</style>

<script id="app">var BarqueroImport = (function(){
  function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function clean(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }

  function parseCSV(text){
    text = String(text || '').replace(/^﻿/, '');
    var rows = [], row = [], f = '', q = false;

    const r = await fetch(SB + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (!r.ok) return null;
    const d = await r.json();
    const ses = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), user: { id: d.user.id, email: d.user.email } };
    // si mientras tanto entró otra persona en este teléfono, no se escribe encima de su sesión
    const ahora = sesionCil(); if (ahora && ahora.user.id !== ses.user.id) return null;
    for (const k of CLAVES_SES) try { localStorage.setItem(k, JSON.stringify(ses)); } catch (_){}
    return ses.access_token;
  }
  async function rpcCil(fn, args){
    const t = await tokenCil();
    if (!t) throw { msg: 'Tu sesión de CIL venció. Entra al menú de CIL y vuelve.' };
    const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SBK, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (_){}
    if (!r.ok) throw { msg: (j && j.message) || 'No se pudo guardar (' + r.status + '). Intenta de nuevo.' };
    return j;
  }

  async function saveEdit(){
    const p = draftProduct();
    let msg = '';
    if (!p.nombre) msg = 'Escribe el título del producto.';
    else if (!p.presentaciones.length) msg = 'Agrega al menos una presentación con su precio.';
    else if (p.presentaciones.some(v => !(isFinite(v.precio) && v.precio > 0))) msg = 'Revisa los precios: cada presentación necesita un precio mayor que cero.';
    const err = $('#ed-err'); err.textContent = msg; err.hidden = !msg;
    if (msg || S.busy) return;
    const now = new Date().toISOString();
    let list;
    if (S.edit.id) list = S.products.map(x => x.id === S.edit.id ? Object.assign({}, x, p, { actualizado: now }) : x);
    else {
      let id = norm(p.nombre).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'producto', n = 2;
      const base = id;
      while (S.products.some(x => x.id === id)) id = base + '-' + (n++);
      list = S.products.concat([Object.assign({ id }, p, { actualizado: now })]);
    }
    await publishData(nextData({ productos: list }), S.edit.id ? 'Producto actualizado' : 'Producto agregado');
  }

  /* ---------- Tasas en GitHub (solo la dueña) ---------- */
  async function ghGetJson(path, tok){
    const { owner, repo } = ghRepo();
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?t=${Date.now()}`, { headers: ghHeaders(tok), cache: 'no-store' });
    if (r.status === 404) return { sha: null, json: null };
    if (!r.ok) throw { status: r.status };
    const j = await r.json();
    const bin = atob(j.content.replace(/\n/g, ''));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return { sha: j.sha, json: JSON.parse(new TextDecoder().decode(bytes)) };
  }
  // Fecha de hoy en Caracas (UTC-4): con ella el descuento queda fijado para todo el día
  const hoyCaracas = () => new Date(Date.now() - 4 * 3600e3).toISOString().slice(0, 10);
  async function shareDisc(v){
    if (!validPct(v) || S.disc.v !== v) return;
    if (S.cil){
      try {
        await rpcCil('fijar_descuento', { p_valor: v });
        const now = new Date().toISOString();
        S.tasas = Object.assign({}, S.tasas || {}, { descuento: v, actualizado: now, revisado: now, manual: true, fecha: hoyCaracas() });
        S.disc = { v: null, date: null, manual: false }; saveDisc();
        rerenderPrices();
        toast(`${num(v)}% guardado para todo el equipo`);
      } catch (e){ toast(e && e.msg ? e.msg : 'Se cambió solo en este equipo: no se pudo guardar para todos.'); }
      return;
    }
    const tok = ghToken(); if (!tok) return;
    const { owner, repo } = ghRepo();
    try {
      const cur = await ghGetJson('tasas.json', tok);
      const now = new Date().toISOString();
      const next = Object.assign({}, cur.json || {}, { descuento: v, actualizado: now, revisado: now, manual: true, fecha: hoyCaracas() });
      const body = { message: `Descuento a mano: ${num(v)}% (armador)`, content: b64(JSON.stringify(next, null, 1)) };
      if (cur.sha) body.sha = cur.sha;
      const p = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tasas.json`, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(tok)), body: JSON.stringify(body) });
      if (!p.ok) throw { status: p.status };
      S.tasas = next;
      S.disc = { v: null, date: null, manual: false }; saveDisc();
      rerenderPrices();
      toast(`${num(v)}% guardado para todo el equipo (lo verán en 1 o 2 minutos)`);
    } catch (e){
      toast('Se cambió solo en este equipo: no se pudo guardar para todos.');
    }
  }
  async function forceUpdate(){
    if (S.cil){
      S.forcing = true; renderDisc();
      try {
        const prevRev = S.tasas && S.tasas.revisado;
        await rpcCil('forzar_tasas');
        // el cálculo tarda 1 o 2 minutos en GitHub; se revisa el archivo público cada 10 segundos
        for (let i = 0; i < 24; i++){
          await new Promise(res => setTimeout(res, 10000));
          await loadTasas();
          if (S.tasas && S.tasas.revisado && S.tasas.revisado !== prevRev && !S.tasas.manual){
            if (overrideToday() && autoToday()) { S.disc = { v: null, date: null, manual: false }; saveDisc(); }
            rerenderPrices();
            toast(S.tasas.error ? 'Actualizado con avisos: ' + S.tasas.error : `Tasas actualizadas: ${num(S.tasas.descuento)}%`);
            return;
          }
        }
        throw { msg: 'Tardó demasiado. Intenta de nuevo en unos minutos.' };
      } catch (e){ toast(e && e.msg ? e.msg : 'No se pudo conectar.'); }
      finally { S.forcing = false; $('#force').textContent = 'Actualizar tasas ahora'; renderDisc(); }
      return;
    }
    const tok = ghToken();
    if (!tok){ toast('Para usar este botón, entra con tu sesión de gerencia en el menú de CIL.'); return; }
    const { owner, repo } = ghRepo();
    S.forcing = true; renderDisc();
    try {
      const before = (await ghGetJson('tasas.json', tok)).json;
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/tasas.yml/dispatches`, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(tok)), body: JSON.stringify({ ref: 'main', inputs: { forzar: 'true' } }) });
      if (r.status === 403 || r.status === 404) throw { msg: 'Tu clave necesita el permiso Actions: Read and write (o falta el archivo tasas.yml).' };
      if (!r.ok) throw { msg: 'GitHub no aceptó la solicitud (' + r.status + ').' };
      const prevRev = before && before.revisado;
      for (let i = 0; i < 24; i++){
        await new Promise(res => setTimeout(res, 10000));
        const now = (await ghGetJson('tasas.json', tok)).json;
        if (now && now.revisado && now.revisado !== prevRev){
          if (now.error && !sameDay(now.actualizado)) throw { msg: 'No se pudieron leer las tasas: ' + now.error };
          S.tasas = now;
          if (overrideToday() && autoToday()) { S.disc = { v: null, date: null, manual: false }; saveDisc(); }
          rerenderPrices();
          toast(now.error ? 'Actualizado con avisos: ' + now.error : `Tasas actualizadas: ${num(now.descuento)}%`);
          return;
        }
      }
      throw { msg: 'Tardó demasiado. Revisa la pestaña Actions en GitHub.' };
    } catch (e){
      toast(e && e.msg ? e.msg : 'No se pudo conectar con GitHub.');
    } finally { S.forcing = false; $('#force').textContent = 'Actualizar tasas ahora'; renderDisc(); }
  }

  $('#ed-del').addEventListener('click', () => {
    const p = S.edit && S.products.find(x => x.id === S.edit.id);
    $('#del-confirm span').textContent = '¿Eliminar este producto del armador? No se borra de la web.' + (p && (p.ficha || p.usos) ? ' Se pierden su ficha y sus usos.' : '');
    $('#del-confirm').hidden = false;
  });
  $('#del-no').addEventListener('click', () => { $('#del-confirm').hidden = true; });
  $('#del-yes').addEventListener('click', () => {
    if (!S.edit || !S.edit.id) return;
    const id = S.edit.id;
    S.sel.delete(id);
    publishData(nextData({ productos: S.products.filter(x => x.id !== id) }), 'Producto eliminado');
  });

  function renderGh(){
    if (HOST !== 'github') return;
    // Gerencia entra con su sesión de CIL: no necesita la clave de GitHub
    $('#gh-admin').hidden = true;
    return;
    $('#gh-status').textContent = ghToken() ? 'Activo en este equipo: puedes actualizar precios y editar productos.' : 'Solo para la dueña. Tu equipo no necesita esto para armar mensajes.';
    $('#gh-out').hidden = !ghToken();
  }
  $('#gh-save').addEventListener('click', async () => {
    const tok = $('#gh-tok').value.trim();
    if (!tok) return;
    const { owner, repo } = ghRepo();
    try {
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: ghHeaders(tok) });
      const j = r.ok ? await r.json() : null;
      if (!j || !(j.permissions && j.permissions.push)){ toast('Esa clave no tiene permiso de escritura en ' + owner + '/' + repo + '.'); return; }
      try { localStorage.setItem(LS_TOK, tok); } catch (_){ toast('Este navegador no permite guardar la clave.'); return; }
      $('#gh-tok').value = '';
      S.owner = true; renderOwner(); renderGh();
      toast('Acceso activado en este equipo');
    } catch (_){ toast('No se pudo conectar con GitHub. Revisa la conexión.'); }
  });
  $('#gh-out').addEventListener('click', () => {
    try { localStorage.removeItem(LS_TOK); } catch (_){}
    S.owner = false; renderOwner(); renderGh();
    toast('Acceso desactivado en este equipo');
  });

  async function loadTasas(){
    try {
      const r = await fetch(DATOS + 'tasas.json?v=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const t = await r.json();
      if (t && validPct(t.descuento)) S.tasas = t;
    } catch (_){}
  }

  /* ---------- Arranque ---------- */
  restoreUI();
  renderAll();
  renderGh();
  if (HOST === 'github'){
    S.owner = !!ghToken(); renderOwner();
    // El catálogo de la última vez abre al instante; el descuento siempre llega fresco (no se guarda: debe ser el de hoy)
    const LS_CAT = 'barquero-armador-catalogo';
    try { const c = JSON.parse(localStorage.getItem(LS_CAT) || 'null'); if (c && c.datos && c.datos.productos){ applyData(c.datos); S.dbVer = c.ver2 || null; restoreUI(); S.loading = false; renderAll(); } } catch (_){}
    S.tasasListas = false;  // mientras llegan, no se avisa «las tasas no se actualizaron hoy»
    (async () => {
      const [db] = await Promise.all([leerDb(), loadTasas()]);
      if (db && db.datos){ applyData(db.datos); S.dbVer = db.editado_en || db.actualizado_en; restoreUI(); try { localStorage.setItem(LS_CAT, JSON.stringify({ datos: db.datos, ver2: S.dbVer })); } catch (_){} }
      else try {
        // mientras nadie haya guardado en la base de datos, se lee el data.json de siempre
        const r = await fetch(DATOS + 'data.json?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw 0;
        applyData(await r.json());
        restoreUI();
      } catch (_){}
      aplicarManual(db); S.tasasListas = true;
      S.loading = false;
      renderAll();
      // ¿Es alguien de gerencia con sesión de CIL en este teléfono? Entonces puede editar sin clave.
      try { if (await tokenCil() && (await rpcCil('es_admin')) === true){ S.cil = true; S.owner = true; renderOwner(); renderGh(); renderAll(); } } catch (_){}
      // Cada 5 minutos: descuento, y precio y stock nuevos del robot (si nadie está editando ni revisando un CSV)
      let verDatos = db && db.actualizado_en;
      setInterval(async () => {
        const before = S.tasas && S.tasas.actualizado;
        await loadTasas();
        const db2 = await leerDb();
        aplicarManual(db2);
        let cambio = (S.tasas && S.tasas.actualizado) !== before;
        if (db2 && db2.datos && db2.actualizado_en !== verDatos && !S.edit && !S.pending && !S.busy){
          verDatos = db2.actualizado_en; applyData(db2.datos); S.dbVer = db2.editado_en || db2.actualizado_en; cambio = true;
          try { localStorage.setItem(LS_CAT, JSON.stringify({ datos: db2.datos, ver2: S.dbVer })); } catch (_){}
        }
        if (cambio){ renderDisc(); renderPicker(); renderComposer(); renderCatalog(); } else renderDisc();
      }, 5 * 60 * 1000);
    })();
    return;
  }
  try { const t = sessionStorage.getItem(SS_TOAST); if (t){ sessionStorage.removeItem(SS_TOAST); toast(t); } } catch (_){}
  (async () => {
    let cl = null;
    for (let i = 0; i < 50 && !cl; i++){
      if (window.claude && typeof window.claude.use === 'function') cl = window.claude;
      else await new Promise(r => setTimeout(r, 100));
    }
    if (!cl) return;
    const [art, user] = await Promise.all([cl.use('artifact'), cl.use('user')]);
    S.art = art;
    S.owner = !!(art && user && await user.canEdit());
    renderOwner();
  })();
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});</script>
