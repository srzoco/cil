<title>Armador de mensajes Barquero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Gloock&family=Montserrat:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Montserrat:wght@400;500;600;700&display=swap"></noscript>
<style id="css">
/* Layout: mostrador de dos paneles. Lista de productos a la izquierda, el mensaje como burbuja de chat a la derecha; en teléfono, un panel a la vez con barra inferior. */
:root{
  /* Colores de Barquero Food (los mismos de CIL): azul #001E54 y grises; el dorado se queda solo en el descuento (señal de venta) */
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --surface-2:#EDF0F5;
  --ink:#0E1A33;
  --muted:#4D5870;
  --line:#D9DFEA;
  --accent:#001E54;
  --accent-ink:#FFFFFF;
  --accent-soft:#E5EBF5;
  --gold-bg:#F4E3B5;
  --gold-ink:#5E4005;
  --gold-line:#DDBF72;
  --bubble:#E4EDF9;
  --danger:#A3263A;
  --danger-soft:#FBE9EC;
  --shadow:rgb(0 30 84 / .08);
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="claro"]){
    --bg:#0A1328; --surface:#111E3A; --surface-2:#1A2747; --ink:#F3F6FB; --muted:#BCC6DA; --line:#34487C;
    --accent:#A9C2F5; --accent-ink:#001E54; --accent-soft:#1A2A50;
    --gold-bg:#382C0E; --gold-ink:#F1D48C; --gold-line:#6A5420;
    --bubble:#18294A; --danger:#F29AA7; --danger-soft:#3A1D29; --shadow:rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="oscuro"]{
  --bg:#0A1328; --surface:#111E3A; --surface-2:#1A2747; --ink:#F3F6FB; --muted:#BCC6DA; --line:#34487C;
  --accent:#A9C2F5; --accent-ink:#001E54; --accent-soft:#1A2A50;
  --gold-bg:#382C0E; --gold-ink:#F1D48C; --gold-line:#6A5420;
  --bubble:#18294A; --danger:#F29AA7; --danger-soft:#3A1D29; --shadow:rgb(0 0 0 / .4);
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

/* Cabecera */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-block:20px 16px}
.eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;text-wrap:balance}
.disc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 16px;background:var(--gold-bg);color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:var(--radius);padding:10px 12px 10px 14px}
.disc-label{grid-column:1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.disc-meta{grid-column:1;margin:0;font-size:12.5px;opacity:.85}
.disc-ctl{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:6px}
.disc-ctl input{width:2.4em;text-align:right;font:400 30px/1 var(--display);color:var(--gold-ink);background:transparent;border:0;border-bottom:2px dashed var(--gold-line);padding:2px 0;font-variant-numeric:tabular-nums}
.disc-ctl input:disabled{border-bottom-color:transparent}
.pct{font:400 22px/1 var(--display)}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold-line);background:var(--surface);color:var(--gold-ink);font-size:18px;line-height:1;cursor:pointer}
.step:disabled{opacity:.4;cursor:not-allowed}

/* Pestañas */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;margin-block:0 16px}
.tabs button{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
@media (max-width:420px){ .tabs button{padding:8px 11px;font-size:13px} }
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}

.note,.warn{margin:0 0 16px;background:var(--gold-bg);color:var(--gold-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.warn{margin:0}
.err{color:var(--danger);font-weight:600;margin:8px 0 0}

/* Campos */
.field{width:100%;box-sizing:border-box;font:15px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.field{resize:vertical}
.flabel{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.hint{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.lbl{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Botones */
.btn{font-weight:700;font-size:14px;border-radius:10px;padding:11px 16px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--danger);color:var(--bg)}
.btn.danger-ghost{background:transparent;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.yobel{margin:10px 16px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.yobel.pide{border:2px solid var(--danger)}
.yobel p{margin:0 0 4px;font-size:14px}
.yobel small{color:var(--muted,inherit);opacity:.8}
.yobel .acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0;cursor:pointer;justify-self:start}

/* Armar */
.armar{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.picker{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-block:12px}
.cat-sel{margin-block:10px 12px;font-weight:600}
.unir{display:grid;gap:8px;background:var(--surface-2);border:1.5px dashed var(--accent);border-radius:12px;padding:12px 14px;margin-block:4px 14px}
.unir-t{margin:0;font-size:14px}
.cola{display:grid;gap:10px;border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;margin-block:4px 14px;background:var(--surface)}
.cola-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cola-head h3{margin:0;font-size:16px}
.cola-item{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.cola-acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cola-sel{flex:1 1 160px;width:auto;padding:8px 10px;font-size:14px}
.cola-motivo{margin:0;font-size:13.5px}
.cola-nota{color:var(--muted)}
.costo-total{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px var(--shadow)}
.costo-total .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.costo-total b{display:block;font:400 30px/1.15 var(--display, Gloock, serif);color:var(--ink);font-variant-numeric:tabular-nums}
.costo-total .sub,.krow .sub{display:block;font-size:13px;color:var(--muted)}
.costo-total .act{flex-basis:100%}
.costo-nota{font-size:13px;color:var(--muted);margin:10px 2px}
.klist{display:grid;gap:10px;margin-top:12px}
.kprod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.krow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ktxt{min-width:0;overflow-wrap:anywhere}
.kin{display:flex;align-items:center;gap:6px;flex:none;font-weight:600;color:var(--muted)}
.kin input{width:92px;font:600 16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg, var(--surface));color:var(--ink);text-align:right}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plist{display:grid;gap:8px}
.prod{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;color:inherit;font-size:15px}
.prod:hover{border-color:var(--accent)}
.prod[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tick{width:22px;height:22px;box-sizing:border-box;border-radius:6px;border:1.5px solid var(--muted);margin-top:1px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accent-ink)}
.prod[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.prod[aria-pressed="true"] .tick::after{content:"✓"}
.prod-main{min-width:0}
.prod-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prod-name{font-weight:700;min-width:0}
.prod-cat{font-size:12px;color:var(--muted);white-space:nowrap}
.prod-lines{display:grid;gap:2px;margin-top:4px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.price{color:var(--ink);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:28px 12px;margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);display:grid;gap:12px;justify-items:center}
.empty.small{padding:16px 12px;font-size:14px}

.composer{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;box-shadow:0 1px 3px var(--shadow)}
.comp-head{display:flex;align-items:baseline;gap:8px}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
.selected{display:grid;gap:8px}
.sitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.sitem-top{display:flex;gap:8px;align-items:flex-start}
.sname{font-weight:600;font-size:14px;flex:1;min-width:0}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vchip{font-size:12.5px;font-weight:500;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 8px;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.vchip[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.bubble{width:100%;box-sizing:border-box;background:var(--bubble);color:var(--ink);border:0;border-radius:16px 16px 4px 16px;padding:14px 16px;font:15px/1.5 var(--body);resize:none;min-height:150px;white-space:pre-wrap;overflow:hidden;font-variant-numeric:tabular-nums}
.bubble::placeholder{color:var(--muted)}
.bubble.static{min-height:0;margin:0;overflow-wrap:anywhere}
#copy{flex:1}

.msgbar{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px var(--shadow);font-weight:700}
.msgbar.show{display:flex}

@media (min-width:880px){
  .armar{grid-template-columns:minmax(0,1fr) minmax(0,400px);align-items:start}
  .composer{position:sticky;top:16px}
  .back.mobile{display:none}
  .msgbar.show{display:none}
}
@media (max-width:879px){
  .armar[data-mode="list"] .composer{display:none}
  .armar[data-mode="msg"] .picker{display:none}
  body.has-bar{padding-bottom:96px}
}

/* Catálogo */
.cat-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.sub{margin:4px 0 0;color:var(--muted);max-width:62ch;font-size:14px}
.clist{display:grid;gap:8px;margin-top:4px}
.cgroup{margin:16px 0 0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crow{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.crow-main{flex:1;min-width:0}
.cname{margin:0;font-weight:700}
.cmeta{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.cvars{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:13.5px;font-variant-numeric:tabular-nums}
.web{color:var(--muted)}
.hoy{font-weight:700}
.ajustes{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.ajustes summary{font-weight:700;cursor:pointer}
.aj-body{padding-bottom:4px}
.aj-body .btn{margin-top:14px}

.editor{display:grid;gap:12px}
.ed-grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.ed-form,.ed-prev{min-width:0}
.ed-prev{display:grid;gap:8px;align-content:start}
.row2{display:grid;gap:0 16px;grid-template-columns:minmax(0,1fr)}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 14px;margin:16px 0 0;display:grid;gap:10px;min-width:0}
legend{font-weight:700;font-size:13px;padding:0 6px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.vrow .v-texto{grid-column:1 / -1}
.v-price{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;color:var(--muted);font-weight:700}
.v-price input{border:0;background:transparent;width:100%;min-width:0;font:700 15px var(--body);padding:10px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.v-price input:focus{outline:none}
.v-price:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.v-kilo{display:flex;gap:6px;align-items:center;font-size:13.5px;white-space:nowrap;cursor:pointer}
.v-medida{width:auto;min-width:0;max-width:150px;padding:10px 8px}
.v-del{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.emojis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emojis button{font-size:18px;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;padding:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--danger-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:10px}
.confirm span{flex:1 1 200px}
.ed-form .actions{margin-top:16px}

@media (min-width:560px){
  .row2{grid-template-columns:1fr 1fr}
  .vrow{grid-template-columns:minmax(0,1fr) 120px auto auto}
  .vrow .v-texto{grid-column:auto}
}
@media (min-width:880px){
  .ed-grid{grid-template-columns:minmax(0,1fr) minmax(0,360px);align-items:start}
  .ed-prev{position:sticky;top:16px}
}

body:not(.owner) .owner-only{display:none!important}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* Descuento por confirmar */
.disc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.disc.pending{background:var(--surface);border-style:dashed}
.mini{border:1px solid var(--gold-line);background:var(--gold-bg);color:var(--gold-ink);font-weight:700;font-size:12.5px;border-radius:999px;padding:3px 10px;cursor:pointer}
.warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.warn span{flex:1 1 180px}
.stamp{margin:0 0 12px;font-size:13px;color:var(--muted)}
/* Herramientas de la dueña */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.report{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin:4px 0 16px;display:grid;gap:10px}
.report h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px}
.report ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px;font-variant-numeric:tabular-nums}
.report .tally{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink)}
.pill.up{background:var(--accent-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--surface-2);color:var(--ink);vertical-align:1px}
.tag.off{background:var(--danger-soft);color:var(--danger)}
.prod-lines .sin{opacity:.55}
.pill.alert{background:var(--danger-soft);color:var(--danger)}
.report details summary{cursor:pointer;font-weight:600;font-size:14px}
.report .scroll{max-height:260px;overflow:auto;margin-top:6px}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgb(0 0 0 / .25);z-index:10}
.busy p{background:var(--surface);color:var(--ink);padding:14px 18px;border-radius:12px;font-weight:700;margin:0;box-shadow:0 4px 20px var(--shadow)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:9px 8px;border-radius:9px;cursor:pointer}

.sw{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;cursor:pointer;min-width:0}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{flex:none;width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked + .track{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .track::after{transform:translateX(18px);background:var(--accent-ink)}
.sw input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.sw-text{display:grid;gap:1px;min-width:0}
.sw-text b{font-size:14px}
.sw-text small{font-size:12px;color:var(--muted)}
body.usd .sw{border-color:var(--accent);background:var(--accent-soft)}
body.usd .disc{opacity:.45}
#usd-badge{display:none;margin-left:4px}
body.usd #usd-badge{display:inline-block}
@media (max-width:559px){.head-ctl{width:100%}.head-ctl > *{flex:1 1 100%}}
@media (prefers-reduced-motion: reduce){.sw .track,.sw .track::after{transition:none}}
.disc-rates{grid-column:1;margin:0;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.disc-rates:empty{display:none}
.disc .auto-val{display:none}
.disc.auto .auto-val{display:flex;align-items:baseline;gap:4px}
.disc.auto .manual{display:none}
#disc-auto{font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.disc.auto .disc-ctl{grid-row:1 / span 3}
.disc-meta .sub-line{flex-basis:100%;font-size:12px;opacity:.85}
.disc-meta .alert-line{font-weight:700}
.disc.pending .alert-line{color:var(--danger)}
.disc-actions{grid-column:1 / -1;display:flex;gap:8px;margin-top:4px}
.mini:disabled{opacity:.5;cursor:wait}
.disc .disc-ctl input::placeholder{color:var(--gold-line)}
.disc-rates{white-space:pre-line}

<script id="app">var BarqueroImport = (function(){
  function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function clean(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }

  function parseCSV(text){
    text = String(text || '').replace(/^﻿/, '');
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (q){
        if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ',' || c === ';'){ row.push(f); f = ''; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(f); f = '';
        if (row.some(function(x){ return x.trim() !== ''; })) rows.push(row);
        row = [];
      } else f += c;
    }
    if (f !== '' || row.length){ row.push(f); if (row.some(function(x){ return x.trim() !== ''; })) rows.push(row); }
    return rows;
  }

  function records(text){
    var rows = parseCSV(text);
    if (!rows.length) return { error: 'El archivo está vacío.' };
    var head = rows[0].map(function(h){ return norm(clean(h)); });
    if (head.indexOf('producto') < 0 || head.indexOf('precio') < 0)
      return { error: 'Este archivo no parece la exportación del catálogo: faltan las columnas Producto y Precio.' };
    return { recs: rows.slice(1).map(function(r){
      var o = {};
      head.forEach(function(k, i){ o[k] = clean(r[i]); });
      return o;
    }) };
  }

  function refOf(r){ return [r.producto, r.talla, r.presentacion, r.sabor, r.modelo, r.peso].map(clean).join('|'); }
  function textoOf(r){
    var p = [];
    if (r.presentacion) p.push(r.presentacion);
    if (r.sabor) p.push(r.sabor);
    if (r.modelo) p.push(r.modelo);
    if (r.talla) p.push('talla ' + r.talla);
    if (r.peso) p.push(r.peso);
    return p.join(' · ');
  }
  function price(s){
    var t = clean(s).replace(/[$\s]/g, '');
    if (/,\d{1,2}$/.test(t) && t.indexOf('.') < 0) t = t.replace(',', '.');
    else t = t.replace(/,/g, '');
    return t === '' ? NaN : Number(t);
  }

  var EMOJI_RULES = [
    [/langosta/, '🦞'], [/camar[o]n/, '🦐'], [/pulpo/, '🐙'], [/calamar/, '🦑'],
    [/cangrejo|chupetica/, '🦀'], [/mejillon|guacuco|chipi/, '🦪'],
    [/bacalao|salmon|atun|mero|pargo|curvina|robalo|dorado|dormilona|carite|claritas|espada|raya|cazon|sardina|anchoa|bonito|camaiguana|sashimi/, '🐟'],
    [/queso|mantequilla/, '🧀'], [/tocineta/, '🥓'],
    [/jamon|prosciutto|guanciale|lomo|lomito|coppa|chorizo|salami|salchich|fuet|pepperoni|loncheado/, '🍖'],
    [/hamburguesa/, '🍔'], [/punta|asado|entrana|carne|pernil/, '🥩'],
    [/aceite|aceituna/, '🫒'], [/nutella/, '🍫'], [/miel|mermelada|pistacho|berryumy|marquesa/, '🍯'],
    [/trufa/, '🍄'], [/empanada|tequeno|hojaldre/, '🥟'], [/papas/, '🍟'],
    [/sazonador|colorante|pimienta|pimenton/, '🧂']
  ];
  var CAT_EMOJI = { 'pescados': '🐟', 'mariscos': '🦐', 'quesos': '🧀', 'carnes': '🥩', 'charcuteria': '🍖', 'grasas': '🫒', 'condimentos': '🧂', 'sazonadores': '🧂', 'dulces': '🍯', 'pasapalos': '🥟', 'enlatados': '🥫', 'enlatados y conservas': '🥫', 'vegetales y frutas': '🥫', 'frutas': '🫒' };
  function emojiFor(name, cat){
    var n = norm(name);
    for (var i = 0; i < EMOJI_RULES.length; i++) if (EMOJI_RULES[i][0].test(n)) return EMOJI_RULES[i][1];
    return CAT_EMOJI[norm(cat)] || '🔹';
  }
  function preguntaFor(group){
    if (group.length < 2) return '';
    var distinct = function(k){ var s = {}; group.forEach(function(v){ s[v.r[k]] = 1; }); return Object.keys(s).length; };
    if (distinct('sabor') === group.length) return '¿Qué sabor prefiere?';
    if (distinct('talla') === group.length) return '¿Qué talla le interesa?';
    return '¿Qué presentación le interesa?';
  }
  function slug(s){ return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'producto'; }

  /* Actualiza los productos existentes con los precios del CSV y agrega los nuevos.
     Las presentaciones sin "ref" (agregadas a mano) no se tocan. */
  function medidaDe(v){ return v && v.medida != null ? String(v.medida) : (v && v.kilo ? 'kg' : ''); }
  // Producto del armador a partir de filas de Yobel ({ref, producto, categoria, precio, stock, kilo?, texto?}); ids = los que ya existen
  // Descripción de Yobel de un producto: las distintas de sus filas (si varían por presentación, cada una con su nombre)
  function descDe(filas){
    var vistas = [], out = [];
    filas.forEach(function(f){ var d = String(f.descripcion || '').trim(); if (d && vistas.indexOf(d) < 0){ vistas.push(d); out.push({ d: d, t: f.texto || '' }); } });
    var txt = out.length > 1 ? out.map(function(x){ return (x.t ? x.t + ': ' : '') + x.d; }).join('\n\n') : (out[0] ? out[0].d : '');
    return txt.slice(0, 3000);
  }
  function textoDeRef(ref){ var x = String(ref || '').split('|'); return textoOf({ producto: x[0], talla: x[1], presentacion: x[2], sabor: x[3], modelo: x[4], peso: x[5] }); }
  function productoNuevo(filas, ids, ahora){
    var r0 = filas[0], id = slug(r0.producto), n = 2;
    while (ids[id]) id = slug(r0.producto) + '-' + (n++);
    var g = filas.map(function(f){ return { texto: f.texto != null ? f.texto : textoDeRef(f.ref), r: { presentacion: (String(f.ref).split('|')[2] || ''), peso: (String(f.ref).split('|')[5] || '') } }; });
    return {
      id: id, nombre: r0.producto, categoria: r0.categoria || '', emoji: emojiFor(r0.producto, r0.categoria),
      pregunta: preguntaFor(g),
      descripcion: descDe(filas.map(function(f, i){ return { descripcion: f.descripcion, texto: g[i].texto }; })),
      presentaciones: filas.map(function(f, i){ var o = { texto: g[i].texto, precio: Number(f.precio), kilo: !!f.kilo, ref: f.ref }; if (f.kilo) o.medida = 'kg'; if (f.stock != null && isFinite(f.stock)) o.stock = Number(f.stock); return o; }),
      actualizado: ahora || new Date().toISOString()
    };
  }
  // descartados = referencias que gerencia dijo «No agregar» (no vuelven a la fila)
  function importCSV(text, productos, ahora, descartados){
    var R = records(text);
    if (R.error) return { error: R.error };
    ahora = ahora || new Date().toISOString();
    var validas = [], piezas = 0, raros = [], inactivas = 0;
    // Precio de $1 o menos suele ser un error del archivo, salvo en lo que se vende por gramo o por 100 g
    var porPeso = {};
    (productos || []).forEach(function(p){ (p.presentaciones || []).forEach(function(v){ if (v.ref && ['g', '100g'].indexOf(medidaDe(v)) >= 0) porPeso[v.ref] = 1; }); });
    R.recs.forEach(function(r){
      if (!r.producto) return;
      if (r.estado && norm(r.estado) !== 'activa'){ inactivas++; return; }
      if (/^V[A-ZÁÉÍÓÚÑ]/.test(r.producto)){ piezas++; return; }
      var p = price(r.precio);
      var st = r.stock != null && r.stock !== '' ? price(r.stock) : NaN;
      var item = { ref: refOf(r), r: r, precio: p, kilo: norm(r.unidad) === 'kg', texto: textoOf(r), stock: st };
      if (!(p > 1) && !(p > 0 && porPeso[item.ref])){ raros.push({ producto: r.producto, texto: item.texto, precio: r.precio }); return; }
      validas.push(item);
    });
    var porRef = {};
    validas.forEach(function(v){ porRef[v.ref] = v; });

    var usadas = {}, cambios = [], eliminadas = [], categorias = [], descripciones = [], out = [];
    (productos || []).forEach(function(p){
      var pres = [], toco = false, cat = '', dfilas = [];
      p.presentaciones.forEach(function(v){
        if (!v.ref){ pres.push(v); return; }
        var n = porRef[v.ref];
        if (!n){
          // no vino en el archivo: no se borra ni se cambia su stock (puede ser un error); queda marcado «stock sin actualizar»
          eliminadas.push({ nombre: p.nombre, texto: v.texto });
          pres.push(Object.assign({}, v, { sin_actualizar: v.sin_actualizar || ahora }));
          return;
        }
        usadas[v.ref] = 1;
        if (n.r.categoria) cat = clean(n.r.categoria);
        dfilas.push({ descripcion: n.r.descripcion, texto: v.texto });
        // Si gerencia eligió la medida a mano (por gramo, por unidad…), el archivo no la cambia
        var aMano = ['', 'kg'].indexOf(medidaDe(v)) < 0;
        if (n.precio !== v.precio || (!aMano && n.kilo !== !!v.kilo)){
          cambios.push({ nombre: p.nombre, texto: v.texto, antes: v.precio, despues: n.precio, kilo: aMano ? medidaDe(v) === 'kg' : n.kilo, medida: aMano ? v.medida : undefined });
          toco = true;
        }
        var o = Object.assign({}, v, aMano ? { precio: n.precio } : { precio: n.precio, kilo: n.kilo, medida: n.kilo ? 'kg' : '' });
        delete o.sin_actualizar;
        if (isFinite(n.stock)) o.stock = n.stock;
        pres.push(o);
      });
      // La categoría manda Yobel: si la corrigieron allá, se actualiza aquí
      var cambioCat = cat && cat !== (p.categoria || '');
      if (cambioCat) categorias.push({ nombre: p.nombre, antes: p.categoria || '', despues: cat });
      // La descripción también manda Yobel (si viene vacía no se borra)
      var d = descDe(dfilas), cambioDesc = d && d !== (p.descripcion || '');
      if (cambioDesc) descripciones.push({ nombre: p.nombre, nueva: !p.descripcion });
      if (pres.length) out.push(Object.assign({}, p, { presentaciones: pres, actualizado: toco || cambioCat ? ahora : p.actualizado }, cambioCat ? { categoria: cat } : {}, cambioDesc ? { descripcion: d } : {}));
    });

    var grupos = [], porNombre = {};
    validas.forEach(function(v){
      if (usadas[v.ref]) return;
      usadas[v.ref] = 1;
      var k = v.r.producto;
      if (!porNombre[k]){ porNombre[k] = []; grupos.push(porNombre[k]); }
      porNombre[k].push(v);
    });
    // Lo nuevo de Yobel no se crea: va a la fila «Nuevos por aprobar» y gerencia decide
    var desc = {}; (descartados || []).forEach(function(x){ desc[x] = 1; });
    var nuevos = [], cola = [];
    grupos.forEach(function(g){
      var filas = g.filter(function(v){ return !desc[v.ref]; });
      if (!filas.length) return;
      nuevos.push(g[0].r.producto);
      filas.forEach(function(v){ var o = { ref: v.ref, producto: v.r.producto, categoria: v.r.categoria || '', precio: v.precio, kilo: v.kilo, texto: v.texto }; if (isFinite(v.stock)) o.stock = v.stock; if (v.r.descripcion) o.descripcion = v.r.descripcion.slice(0, 3000); cola.push(o); });
    });
    return { productos: out, cola: cola, informe: { cambios: cambios, categorias: categorias, descripciones: descripciones, nuevos: nuevos, eliminadas: eliminadas, piezas: piezas, raros: raros, inactivas: inactivas, filas: R.recs.length } };
  }

  /* Costos del archivo de Yobel (columna «Costo promedio»): solo referencia, costo y unidad.
     Nunca entran al catálogo (que es público): van a la tabla privada de costos. */
  function costosCSV(text){
    var R = records(text);
    if (R.error) return [];
    var out = [];
    R.recs.forEach(function(r){
      if (!r.producto || (r.estado && norm(r.estado) !== 'activa') || /^V[A-ZÁÉÍÓÚÑ]/.test(r.producto)) return;
      var c = price(r['costo promedio']);
      if (c > 0) out.push({ ref: refOf(r), producto: r.producto.slice(0, 200), costo: c, unidad: r.unidad || '' });
    });
    return out;
  }
  return { parseCSV: parseCSV, importCSV: importCSV, emojiFor: emojiFor, costosCSV: costosCSV, productoNuevo: productoNuevo };
})();
if (typeof module !== 'undefined') module.exports = BarqueroImport;

  function medidas(){ return [['', 'sin medida', '', ''], ['kg', 'por kilo', ' el kilo', '/kg'], ['g', 'por gramo', ' el gramo', '/g'], ['100g', 'por 100 g', ' los 100 g', '/100 g'],
    ['l', 'por litro', ' el litro', '/l'], ['u', 'por unidad', ' la unidad', '/u'], ['docena', 'por docena', ' la docena', '/docena'], ['paquete', 'por paquete', ' el paquete', '/paq.'], ['caja', 'por caja', ' la caja', '/caja']]; }
  function medidaDe(v){ return v && v.medida != null ? String(v.medida) : (v && v.kilo ? 'kg' : ''); }
  function medidaTxt(v, corto){ var m = medidas().find(function(x){ return x[0] === medidaDe(v); }); return m ? m[corto ? 3 : 2] : ''; }
  function lineFor(p, v, d){
    return (p.emoji || '🔹') + ' ' + money(priceToday(v, d)) + medidaTxt(v) + (v.texto ? ' ' + v.texto.trim() : '');
  }
  function selEntries(){
    const out = [];
    for (const [id, set] of S.sel){
      const p = S.products.find(x => x.id === id);

      const idxs = [...set].filter(i => i < p.presentaciones.length).sort((a, b) => a - b);

  }

    const st = S.ajustes;
    const parts = e.map(({ p, idxs }) => [p.nombre.trim(), idxs.map(i => lineFor(p, p.presentaciones[i], d)).join('\n')].filter(Boolean).join('\n'));
    let q = '';
    if (e.length > 1) q = st.preguntaVarios != null ? st.preguntaVarios : DEF.preguntaVarios;
    else {
      const { p, idxs } = e[0];
      if (p.pregunta && !(idxs.length === 1 && p.presentaciones.length > 1)) q = p.pregunta;
    }
    if (q && q.trim()) parts.push(q.trim());

  async function rpcCil(fn, args){

    const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SBK, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (_){}

  /* ---------- Render ---------- */
  function renderAll(){ renderTabs(); renderDisc(); renderPicker(); renderComposer(); renderBar(); renderCatalog(); renderOwner(); renderCosto(); }

  /* ---------- Cotizador a costo ---------- */
  // Cómo se cuenta: por kilo, por gramo o por unidad (según la unidad de Yobel; si no trae, la medida del catálogo)
  function tipoCant(v, c){
    const u = norm(c && c.unidad || '').trim();
    if (/^(kg|kgs|kilo|kilos|kilogramo|kilogramos)$/.test(u)) return 'kg';
    if (/^(g|gr|grs|gramo|gramos)$/.test(u)) return 'g';
    if (u) return 'u';
    const m = medidaDe(v); return m === 'kg' ? 'kg' : m === 'g' ? 'g' : 'u';
  }
  const CANT = { kg: { paso: '0.001', corto: 'kg', precio: 'el kilo', nombre: 'kilos', sin: 'por kilo' }, g: { paso: '1', corto: 'g', precio: 'el gramo', nombre: 'gramos', sin: 'por gramo' },
    u: { paso: '1', corto: 'und', precio: 'c/u', nombre: 'unidades', sin: 'unidad' } };
  function costoDe(ref){ const c = S.costos && ref && S.costos.get(ref); return c ? Math.round(c.costo * (1 + S.margen / 100) * 100) / 100 : null; }
  function totalCosto(){ let t = 0, n = 0; for (const [ref, q] of S.kcant){ const c = costoDe(ref); if (c != null && q > 0){ t += c * q; n++; } } return { t: Math.round(t * 100) / 100, n }; }
  function renderCostoTotal(){
    if (!S.costos) return;
    const { t, n } = totalCosto();
    let ult = ''; for (const c of S.costos.values()) if (!ult || c.actualizado > ult) ult = c.actualizado;
    $('#costo-total').innerHTML = `<div><span class="lbl">Total a costo</span><b>${money(t)}</b><span class="sub">${n ? n + (n === 1 ? ' producto' : ' productos') : 'Escribe cantidades abajo'} · costo promedio + ${num(S.margen)} %</span></div>` +
      `<button type="button" class="btn ghost" id="k-clear"${n ? '' : ' disabled'}>Limpiar</button>` +
      (ult ? `<span class="sub act">Costos de Yobel del ${esc(new Date(ult).toLocaleString('es-VE', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }))}</span>` : '');
  }
  function renderCosto(){
    if (!S.costos){ return; }
    renderCostoTotal();
    const items = S.products.filter(p => matches(p, S.kq)).map(p => ({ p, vs: p.presentaciones.filter(v => v.ref && S.costos.has(v.ref)) })).filter(x => x.vs.length);
    if (!items.length){ $('#klist').innerHTML = `<p class="empty">${S.kq ? 'Ningún producto con costo coincide con «' + esc(S.kq) + '».' : 'Todavía no hay costos de Yobel. Gerencia los sube con el archivo de Yobel en Catálogo.'}</p>`; return; }
    $('#klist').innerHTML = items.map(({ p, vs }) => `<div class="kprod"><b>${esc(p.emoji || '🔹')} ${esc(p.nombre)}</b>` + vs.map(v => {
      const c = S.costos.get(v.ref), k = CANT[tipoCant(v, c)], q = S.kcant.get(v.ref);
      return `<label class="krow"><span class="ktxt">${esc(v.texto || k.sin)}<span class="sub">${money(costoDe(v.ref))} ${k.precio}</span></span>` +
        `<span class="kin"><input type="number" inputmode="decimal" min="0" step="${k.paso}" data-kref="${esc(v.ref)}" value="${q > 0 ? esc(q) : ''}" placeholder="0" aria-label="${esc(p.nombre + ' ' + (v.texto || ''))}, ${k.nombre}"><span>${k.corto}</span></span></label>`;
    }).join('') + '</div>').join('');
  }
  async function cargarCostos(){
    try {

  function fmtWhen(iso){
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const hora = d.toLocaleTimeString('es-VE', { hour: 'numeric', minute: '2-digit' });
    const now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
    const dia = d.toDateString() === now.toDateString() ? 'hoy' : d.toDateString() === y.toDateString() ? 'ayer' : d.toLocaleDateString('es-VE', { weekday: 'short', day: 'numeric', month: 'short' });
    return dia + ' ' + hora;
  }
  const fmtRate = n => Number(n).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* ---------- Nuevos de Yobel por aprobar ---------- */
  function colaGrupos(){
    const g = new Map();
    for (const f of (DATA.nuevos || [])) { if (!g.has(f.producto)) g.set(f.producto, []); g.get(f.producto).push(f); }
    return [...g.entries()].map(([producto, filas]) => ({ producto, filas }));
  }
  function renderCola(){
    const box = $('#cola'), gs = colaGrupos();
    box.hidden = !gs.length || !S.owner;
    if (box.hidden){ box.innerHTML = ''; return; }
    const opts = '<option value="">Es el mismo que…</option>' + S.products.slice().sort((a, b) => (a.presentaciones.some(v => v.sin_actualizar) ? 0 : 1) - (b.presentaciones.some(v => v.sin_actualizar) ? 0 : 1) || (a.nombre < b.nombre ? -1 : 1))
      .map(p => `<option value="${esc(p.id)}">${p.presentaciones.some(v => v.sin_actualizar) ? '⏸ ' : ''}${esc(p.nombre)}</option>`).join('');
    box.innerHTML = `<div class="cola-head"><h3>Nuevos de Yobel por aprobar <span class="pill">${gs.length}</span></h3></div>
      <p class="hint" style="margin:0">No están en el armador. Agrégalos, júntalos con uno que tenga otro nombre (⏸ = quedó sin actualizar) o descártalos.</p>` +
      gs.map((g, i) => { const m = motivoCola(g);
        return `<div class="cola-item" data-i="${i}"><p class="cname">${esc(g.producto)}</p><p class="cmeta">${esc(g.filas[0].categoria || 'Sin categoría')} · ${g.filas.map(f => esc(money(f.precio)) + (f.texto ? ' ' + esc(f.texto) : '')).join(' · ')}</p>
        <p class="cola-motivo"><b>Por qué no entró:</b> ${esc(m.txt)}${m.notas.length ? ' <span class="cola-nota">(' + esc(m.notas.join('; ')) + ')</span>' : ''}</p>
        <div class="cola-acc">${m.sugerido ? `<button type="button" class="btn primary small" data-cola="mismo-sug" data-id="${esc(m.sugerido)}">Es el mismo: juntar</button><button type="button" class="btn ghost small" data-cola="agregar">Agregar como nuevo</button>` : '<button type="button" class="btn primary small" data-cola="agregar">Agregar</button>'}<select class="field cola-sel" data-cola="mismo" aria-label="Es el mismo que…">${opts}</select><button type="button" class="btn ghost small" data-cola="no">No agregar</button></div></div>`; }).join('');
  }
  // Por qué no entró: ¿parece un producto del armador con otro nombre (el viejo quedó sin actualizar)? ¿o es nuevo de verdad?
  function motivoCola(g){
    const pv = palabras(g.producto);
    let mejor = null, puntos = 0;
    for (const p of S.products){
      const pw = new Set(palabras(p.nombre)), n = pv.filter(w => pw.has(w)).length;
      const score = n / Math.max(1, Math.min(pv.length, pw.size));
      if (n >= 2 && score > puntos){ puntos = score; mejor = p; }
    }
    const pausado = mejor && mejor.presentaciones.some(v => v.sin_actualizar);
    const notas = [];
    if (g.filas.every(f => Number(f.stock) <= 0)) notas.push('sin stock en Yobel');
    const porPeso = mejor && mejor.presentaciones.some(v => ['g', '100g'].includes(medidaDe(v)));
    if (g.filas.some(f => Number(f.precio) <= 1) && !porPeso) notas.push('precio de $1 o menos: revísalo');
    if (mejor && pausado && puntos >= 0.5) return { txt: `Parece «${mejor.nombre}» con otro nombre: ese quedó sin actualizar en Yobel.`, sugerido: mejor.id, notas };
    if (mejor && puntos >= 0.6) return { txt: `No está en el armador. Se parece a «${mejor.nombre}» (¿otra presentación?).`, sugerido: null, notas };
    return { txt: 'Producto nuevo en Yobel: nunca estuvo en el armador.', sugerido: null, notas };
  }
  function sinDeLaCola(refs){ const q = new Set(refs); return (DATA.nuevos || []).filter(f => !q.has(f.ref)); }
  function idsActuales(){ const ids = {}; S.products.forEach(p => { ids[p.id] = 1; }); return ids; }
  function colaAccion(tipo, g, conId){
    if (S.busy) return;
    const refs = g ? g.filas.map(f => f.ref) : [], ahora = new Date().toISOString();
    if (tipo === 'agregar'){
      const nuevo = IMP.productoNuevo(g.filas, idsActuales(), ahora);
      publishData(nextData({ productos: sortProds(S.products.concat([nuevo])), nuevos: sinDeLaCola(refs) }), `«${g.producto}» agregado al armador`);
    } else if (tipo === 'todos'){
      const ids = idsActuales(), add = [];
      for (const x of colaGrupos()){ const n = IMP.productoNuevo(x.filas, ids, ahora); ids[n.id] = 1; add.push(n); }
      publishData(nextData({ productos: sortProds(S.products.concat(add)), nuevos: [] }), `${add.length} productos agregados al armador`);
    } else if (tipo === 'no'){
      const desc = (DATA.descartados || []).concat(refs).slice(-1000);
      publishData(nextData({ nuevos: sinDeLaCola(refs), descartados: desc }), `«${g.producto}» no se agrega (no vuelve a aparecer aquí)`);
    } else if (tipo === 'mismo'){
      const viejo = S.products.find(x => x.id === conId); if (!viejo) return;
      const junto = unirProductos(viejo, IMP.productoNuevo(g.filas, {}, ahora));
      publishData(nextData({ productos: S.products.map(x => x.id === viejo.id ? junto : x), nuevos: sinDeLaCola(refs) }), `Listo: «${g.producto}» quedó junto con lo que tenía «${viejo.nombre}»`);
    }
  }

        <button type="button" class="btn primary" id="imp-ok" ${nothing ? 'disabled' : ''}>${nothing ? 'No hay cambios' : 'Publicar cambios'}</button>
        <button type="button" class="btn ghost" id="imp-cancel">Cancelar</button>
      </div>`;
    box.hidden = false;
  }

  /* ---------- Editor de producto ---------- */
  function openEditor(id){
    const p = id ? S.products.find(x => x.id === id) : null;
    const draft = p
      ? { presentaciones: p.presentaciones.map(v => ({ texto: v.texto, precio: num(v.precio), medida: medidaDe(v), ref: v.ref || null, stock: v.stock })) }
      : { presentaciones: [{ texto: '', precio: '', medida: '', ref: null }] };

    $('#f-nombre').focus();

  function closeEditor(){ S.edit = null; renderCatalog(); }

  /* ---------- «Es el mismo que…»: producto al que le cambiaron el nombre en Yobel ----------
     Se queda el producto viejo (su id: ficha, usos, bajo pedido, emoji, pregunta, medidas y el contador de uso del bot)
     con el nombre, las referencias, precios y stock del nuevo. El nuevo se quita de la lista. */
  function palabras(t){ return norm(t).split(/[^a-z0-9]+/).filter(w => w.length > 2); }
  function renderUnir(p){
    const box = $('#unir-box');
    const viejo = p && p.presentaciones.some(v => v.sin_actualizar);
    box.hidden = !viejo;
    if (!viejo) return;
    const pv = new Set(palabras(p.nombre));
    const cand = S.products.filter(x => x.id !== p.id && x.presentaciones.some(v => v.ref && !v.sin_actualizar))
      .map(x => ({ x, n: palabras(x.nombre).filter(w => pv.has(w)).length }))
      .sort((a, b) => b.n - a.n || (a.x.nombre < b.x.nombre ? -1 : 1));
    // primero los de la fila «Nuevos por aprobar» (lo más probable: el mismo producto con el nombre corregido en Yobel)
    const cola = colaGrupos().map((g, i) => ({ g, i, n: palabras(g.producto).filter(w => pv.has(w)).length })).sort((a, b) => b.n - a.n);
    $('#unir-sel').innerHTML = '<option value="">Elige el producto nuevo…</option>' +
      (cola.length ? '<optgroup label="Nuevos de Yobel por aprobar">' + cola.map(({ g, i, n }) => `<option value="cola:${i}">${n ? '★ ' : ''}${esc(g.producto)}</option>`).join('') + '</optgroup><optgroup label="Ya en el armador">' : '') +
      cand.map(({ x, n }) => `<option value="${esc(x.id)}">${n ? '★ ' : ''}${esc(x.nombre)}${x.ficha || x.usos || x.notas ? ' (ya tiene ficha)' : ''}</option>`).join('') + (cola.length ? '</optgroup>' : '');
    $('#unir-prev').textContent = cand.length || cola.length ? '★ = se parece al nombre de este producto.' : 'No hay productos nuevos de Yobel para juntar.';
    $('#unir-ok').disabled = true;
  }
  function elegidoUnir(v){
    if (String(v).startsWith('cola:')) { const g = colaGrupos()[Number(v.slice(5))]; return g ? IMP.productoNuevo(g.filas, {}) : null; }
    return S.products.find(x => x.id === v) || null;
  }
  function unirProductos(viejo, nuevo){
    const conRef = viejo.presentaciones.filter(v => v.ref), usadas = new Set();
    const pres = nuevo.presentaciones.map((nv, i) => {
      // misma presentación: mismo texto; si no, misma posición (si tienen las mismas); si el viejo tenía una sola, esa
      let j = conRef.findIndex((o, k) => !usadas.has(k) && norm(String(o.texto || '').replace(/\s+/g, ' ').trim()) === norm(String(nv.texto || '').replace(/\s+/g, ' ').trim()));
      if (j < 0 && conRef.length === nuevo.presentaciones.length && !usadas.has(i)) j = i;
      if (j < 0 && conRef.length === 1) j = 0;
      const ov = j >= 0 ? conRef[j] : null;
      if (ov && conRef.length > 1) usadas.add(j);
      const o = Object.assign({}, nv);
      if (ov && ov.medida != null && ov.medida !== '') { o.medida = ov.medida; o.kilo = ov.medida === 'kg'; }
      else if (ov && ov.kilo && !o.medida) { o.medida = 'kg'; o.kilo = true; }
      return o;
    });
    const aMano = viejo.presentaciones.filter(v => !v.ref);   // las que se agregaron a mano se conservan
    const vacio = v => v == null || String(v).trim() === '';
    return Object.assign({}, nuevo, {
      id: viejo.id,
      categoria: vacio(nuevo.categoria) ? viejo.categoria : nuevo.categoria,   // la categoría manda Yobel
      emoji: vacio(viejo.emoji) || viejo.emoji === '🔹' ? nuevo.emoji : viejo.emoji,
      pregunta: vacio(viejo.pregunta) ? nuevo.pregunta : viejo.pregunta,
      descripcion: vacio(nuevo.descripcion) ? viejo.descripcion : nuevo.descripcion,   // la descripción manda Yobel
      ficha: vacio(viejo.ficha) ? nuevo.ficha : viejo.ficha,
      usos: vacio(viejo.usos) ? nuevo.usos : viejo.usos,
      notas: vacio(viejo.notas) ? nuevo.notas : viejo.notas,
      bajo_pedido: !!(viejo.bajo_pedido || nuevo.bajo_pedido),
      presentaciones: pres.concat(aMano),
      actualizado: new Date().toISOString()
    });
  }
  function renderVrows(){
    const rows = S.edit.draft.presentaciones;
    $('#vrows').innerHTML = rows.map((v, i) => `<div class="vrow" data-i="${i}">
      <input id="v-texto-${i}" class="field v-texto" data-k="texto" type="text" value="${esc(v.texto)}" placeholder="${i === 0 ? 'de la barra completa (aprox. 3kg)' : 'de la media barra (aprox. 1.5kg)'}" aria-label="Descripción de la presentación ${i + 1}">
      <span class="v-price"><span aria-hidden="true">$</span><input id="v-precio-${i}" data-k="precio" type="text" inputmode="decimal" value="${esc(v.precio)}" placeholder="0" aria-label="Precio en la web, presentación ${i + 1}"></span>
      <select id="v-medida-${i}" class="field v-medida" data-k="medida" aria-label="Medida del precio, presentación ${i + 1}">${medidas().map(m => `<option value="${m[0]}"${medidaDe(v) === m[0] ? ' selected' : ''}>${m[1]}</option>`).join('')}</select>
      <button type="button" class="v-del" data-del="${i}" aria-label="Quitar presentación ${i + 1}" ${rows.length < 2 ? 'disabled' : ''}>×</button>
    </div>`).join('');
  }
  function draftProduct(){
    return {
      nombre: $('#f-nombre').value.trim(),
      categoria: $('#f-cat').value.trim(),
      emoji: $('#f-emoji').value.trim(),
      pregunta: $('#f-preg').value.trim(),
      bajo_pedido: $('#f-pedido').checked,
      ficha: $('#f-ficha').value.trim(),
      usos: $('#f-usos').value.trim(),
      notas: $('#f-notas').value.trim(),
      presentaciones: S.edit.draft.presentaciones
        .map(v => { const md = medidaDe(v), o = { texto: String(v.texto || '').trim(), precio: parseNum(v.precio), kilo: md === 'kg', medida: md }; if (v.ref) o.ref = v.ref; if (v.stock != null && v.stock !== '') o.stock = v.stock; return o; })
        .filter(v => v.texto || isFinite(v.precio))
    };
  }
  function renderEdPreview(){
    const p = draftProduct();
    const d = disc();
    const lines = p.presentaciones.filter(v => isFinite(v.precio) && v.precio > 0).map(v => lineFor(p, v, d)).join('\n');
    $('#ed-preview').textContent = [p.nombre || 'Título del producto', lines || (p.emoji || '🔹') + ' $0'].join('\n') + (p.pregunta ? '\n\n' + p.pregunta : '');
    $('#ed-prev-note').textContent = d == null ? 'Sin descuento: se muestran los precios de la web.' : `Con el ${num(d)}% de descuento. El cierre se agrega al armar el mensaje.`;
  }
  async function saveEdit(){
    const p = draftProduct();
    let msg = '';
    if (!p.nombre) msg = 'Escribe el título del producto.';
    else if (!p.presentaciones.length) msg = 'Agrega al menos una presentación con su precio.';
    else if (p.presentaciones.some(v => !(isFinite(v.precio) && v.precio > 0))) msg = 'Revisa los precios: cada presentación necesita un precio mayor que cero.';
    const err = $('#ed-err'); err.textContent = msg; err.hidden = !msg;
    if (msg || S.busy) return;
    const now = new Date().toISOString();
    let list;
    if (S.edit.id) list = S.products.map(x => x.id === S.edit.id ? Object.assign({}, x, p, { actualizado: now }) : x);
    else {
      let id = norm(p.nombre).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'producto', n = 2;
      const base = id;
      while (S.products.some(x => x.id === id)) id = base + '-' + (n++);
      list = S.products.concat([Object.assign({ id }, p, { actualizado: now })]);
    }
    await publishData(nextData({ productos: list }), S.edit.id ? 'Producto actualizado' : 'Producto agregado');
  }

  /* ---------- Acciones ---------- */

    if (S.sel.has(id)) S.sel.delete(id);
    else {
      const p = S.products.find(x => x.id === id);
      if (!p) return;
      const hay = p.presentaciones.map((_, i) => i).filter(i => !agotado(p, p.presentaciones[i]));
      S.sel.set(id, new Set(hay.length ? hay : p.presentaciones.map((_, i) => i)));

  // Suma 1 a cada producto del mensaje copiado (una vez por mensaje): el bot ofrece primero los más usados
  function contarUso(){
    if (!SB) return;
    const ids = selEntries().map(e => e.p.id).sort();
    const k = ids.join(',') + '|' + $('#msg').value;
    if (!ids.length || k === S.contado) return;
    S.contado = k;
    fetch(SB + '/rest/v1/rpc/armador_usado', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_ids: ids }) }).catch(() => {});
  }
  async function copyMsg(){
    const ta = $('#msg');
    const text = ta.value;
    if (!text.trim() || !confirmed()) return;
    try {
      await navigator.clipboard.writeText(text);
      toast('Mensaje copiado'); contarUso();
    } catch (e){
      ta.focus(); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_){}
      toast(ok ? 'Mensaje copiado' : 'Texto seleccionado: cópialo con el menú del teléfono');
      if (ok) contarUso();
    }
  }
  let shareT;

  function setDisc(v){
    S.disc = { v, date: today(), manual: true };
    saveDisc();
    rerenderPrices();
    if (HOST === 'github' && S.cil){
      clearTimeout(shareT);
      shareT = setTimeout(() => shareDisc(v), 1500);
    }

  function backToAuto(){
    S.disc = { v: null, date: null, manual: false };

  /* ---------- Descuento del día para todo el equipo (solo gerencia, con su sesión de CIL) ---------- */
  // Fecha de hoy en Caracas (UTC-4): con ella el descuento queda fijado para todo el día
  const hoyCaracas = () => new Date(Date.now() - 4 * 3600e3).toISOString().slice(0, 10);
  async function shareDisc(v){
    if (!validPct(v) || S.disc.v !== v) return;
    if (S.cil){
      try {
        await rpcCil('fijar_descuento', { p_valor: v });
        const now = new Date().toISOString();
        S.tasas = Object.assign({}, S.tasas || {}, { descuento: v, actualizado: now, revisado: now, manual: true, fecha: hoyCaracas() });
        S.disc = { v: null, date: null, manual: false }; saveDisc();
        rerenderPrices();
        toast(`${num(v)}% guardado para todo el equipo`);
      } catch (e){ toast(e && e.msg ? e.msg : 'Se cambió solo en este equipo: no se pudo guardar para todos.'); }
    }
  }
  async function forceUpdate(){
    if (S.cil){
      S.forcing = true; renderDisc();
      try {
        const prevRev = S.tasas && S.tasas.revisado;
        await rpcCil('forzar_tasas');
        // el cálculo tarda 1 o 2 minutos en GitHub; se revisa el archivo público cada 10 segundos
        for (let i = 0; i < 24; i++){
          await new Promise(res => setTimeout(res, 10000));
          await loadTasas();
          if (S.tasas && S.tasas.revisado && S.tasas.revisado !== prevRev && !S.tasas.manual){
            if (overrideToday() && autoToday()) { S.disc = { v: null, date: null, manual: false }; saveDisc(); }
            rerenderPrices();
            toast(S.tasas.error ? 'Actualizado con avisos: ' + S.tasas.error : `Tasas actualizadas: ${num(S.tasas.descuento)}%`);
            return;
          }
        }
        throw { msg: 'Tardó demasiado. Intenta de nuevo en unos minutos.' };
      } catch (e){ toast(e && e.msg ? e.msg : 'No se pudo conectar.'); }
      finally { S.forcing = false; $('#force').textContent = 'Actualizar tasas ahora'; renderDisc(); }
      return;
    }
    toast('Para usar este botón, entra con tu sesión de gerencia en el menú de CIL.');
  }

  });
  $('#unir-sel').addEventListener('change', e => {
    const viejo = S.edit && S.products.find(x => x.id === S.edit.id), nuevo = elegidoUnir(e.target.value);
    $('#unir-ok').disabled = !(viejo && nuevo);
    $('#unir-prev').textContent = viejo && nuevo ? `Queda un solo producto: «${nuevo.nombre}», con los precios y el stock de Yobel, y la ficha, los usos, las medidas y el historial de «${viejo.nombre}». «${nuevo.nombre}» deja de salir repetido.` : '';
  });
  $('#unir-ok').addEventListener('click', () => {
    const v = $('#unir-sel').value;
    const viejo = S.edit && S.products.find(x => x.id === S.edit.id), nuevo = elegidoUnir(v);
    if (!viejo || !nuevo || S.busy) return;
    if (v.startsWith('cola:')) { colaAccion('mismo', colaGrupos()[Number(v.slice(5))], viejo.id); return; }
    const junto = unirProductos(viejo, nuevo);
    if (S.sel.has(nuevo.id)) { S.sel.set(viejo.id, S.sel.get(nuevo.id)); S.sel.delete(nuevo.id); }
    const list = S.products.filter(x => x.id !== nuevo.id).map(x => x.id === viejo.id ? junto : x);
    publishData(nextData({ productos: list }), `Listo: «${nuevo.nombre}» quedó junto con lo que tenía «${viejo.nombre}»`);
  });
  $('#del-yes').addEventListener('click', () => {
    if (!S.edit || !S.edit.id) return;
    const id = S.edit.id;
    S.sel.delete(id);
    publishData(nextData({ productos: S.products.filter(x => x.id !== id) }), 'Producto eliminado');
  });

  async function loadTasas(){
    try {
      const r = await fetch(DATOS + 'tasas.json?v=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const t = await r.json();
      if (t && validPct(t.descuento)) S.tasas = t;
    } catch (_){}
  }

  /* ---------- Arranque ---------- */
  restoreUI();
  renderAll();
  if (HOST === 'github'){
    S.owner = false; renderOwner();
    // El catálogo de la última vez abre al instante; el descuento siempre llega fresco (no se guarda: debe ser el de hoy)
    const LS_CAT = 'barquero-armador-catalogo';
    try { const c = JSON.parse(localStorage.getItem(LS_CAT) || 'null'); if (c && c.datos && c.datos.productos){ applyData(c.datos); S.dbVer = c.ver2 || null; restoreUI(); S.loading = false; renderAll(); } } catch (_){}
    S.tasasListas = false;  // mientras llegan, no se avisa «las tasas no se actualizaron hoy»
    (async () => {
      const [db] = await Promise.all([leerDb(), loadTasas()]);
      if (db && db.datos){ applyData(db.datos); S.dbVer = db.editado_en || db.actualizado_en; restoreUI(); try { localStorage.setItem(LS_CAT, JSON.stringify({ datos: db.datos, ver2: S.dbVer })); } catch (_){} }
      else try {
        // mientras nadie haya guardado en la base de datos, se lee el data.json de siempre
        const r = await fetch(DATOS + 'data.json?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw 0;
        applyData(await r.json());
        restoreUI();
      } catch (_){}
      aplicarManual(db); S.tasasListas = true;
      S.loading = false;
      renderAll();
      // ¿Es alguien de gerencia con sesión de CIL en este teléfono? Entonces puede editar sin clave.
      try { if (await tokenCil() && (await rpcCil('es_admin')) === true){ S.cil = true; S.owner = true; renderOwner(); renderAll(); } } catch (_){}
      cargarYobel();
      cargarCostos();
      // Cada 5 minutos: descuento, y precio y stock nuevos del robot (si nadie está editando ni revisando un CSV)
      let verDatos = db && db.actualizado_en;
      setInterval(async () => {
        const before = S.tasas && S.tasas.actualizado;
        await loadTasas();
        const db2 = await leerDb();
        aplicarManual(db2);
        let cambio = (S.tasas && S.tasas.actualizado) !== before;
        if (db2 && db2.datos && db2.actualizado_en !== verDatos && !S.edit && !S.pending && !S.busy){
          verDatos = db2.actualizado_en; applyData(db2.datos); S.dbVer = db2.editado_en || db2.actualizado_en; cambio = true;
          try { localStorage.setItem(LS_CAT, JSON.stringify({ datos: db2.datos, ver2: S.dbVer })); } catch (_){}
        }
        if (cambio){ renderDisc(); renderPicker(); renderComposer(); renderCatalog(); } else renderDisc();
        cargarYobel();
      }, 5 * 60 * 1000);
    })();
    return;
  }
  try { const t = sessionStorage.getItem(SS_TOAST); if (t){ sessionStorage.removeItem(SS_TOAST); toast(t); } } catch (_){}
  (async () => {
    let cl = null;
    for (let i = 0; i < 50 && !cl; i++){
      if (window.claude && typeof window.claude.use === 'function') cl = window.claude;
      else await new Promise(r => setTimeout(r, 100));
    }
    if (!cl) return;
    const [art, user] = await Promise.all([cl.use('artifact'), cl.use('user')]);
    S.art = art;
    S.owner = !!(art && user && await user.canEdit());
    renderOwner();
  })();
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});</script>
